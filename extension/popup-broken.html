<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Cart Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            color: #ff4444;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="time"] {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #cc0000;
        }
        #statusMessage {
            margin-top: 10px;
            font-size: 14px;
            color: green;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <h2>Ghost Cart Config</h2>
    <p>Set your impulse-buying vulnerability hours.</p>

    <div class="form-group">
        <label for="startTime">Start Time:</label>
        <input type="time" id="startTime" name="startTime">
    </div>

    <div class="form-group">
        <label for="endTime">End Time:</label>
        <input type="time" id="endTime" name="endTime">
    </div>

    <button id="saveBtn">Save Settings</button>
    <div id="statusMessage">Settings saved!</div>

    <script src="popup.js"></script>
</body>
</html>
